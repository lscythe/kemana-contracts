min_version = "2026.11.4"

[tools]
buf = "1.75.0"
hk = "2.11.1"
python = "3.15.2"
taplo = "0.10.0"
"aqua:owenlamont/ryl" = "0.29.0"

[hooks]
postinstall = "hk install --mise"

[tasks.format]
description = "Format the protobuf sources"
run = "buf format -w"

[tasks.check]
description = "Run the static checks"
run = ["buf format --diff --exit-code", "buf lint", "buf build"]

[tasks.test]
description = "Run the commit scope tests"
run = "python3 -m unittest discover -s .github/scripts -p 'test_*.py'"
