[tools]
buf = "1.75.0"
hk = "2.9.0"
python = "3.15.2"

[tasks.format]
description = "Format the protobuf sources"
run = "buf format -w"

[tasks.check]
description = "Run the static checks"
run = [
  "buf format --diff --exit-code",
  "buf lint",
  "buf build",
]

[tasks.test]
description = "Run the commit scope tests"
run = "python3 -m unittest discover -s .github/scripts -p 'test_*.py'"
